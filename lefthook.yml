# Hooks only check and report; they never modify files.
# Fix what they report with the writing tasks (task format).
# Jobs call only hook:* tasks, which clear the GIT_DIR family of variables
# git exports to hooks before running the real task.
output: [failure]

pre-commit:
  parallel: true    # hooks never write, so checks cannot race
  jobs:
    - name: format
      glob: "*.go"
      run: task hook:format -- {staged_files}
    - name: lint
      glob: "*.go"
      run: task hook:lint
    - name: proto
      glob: "*.proto"
      run: task hook:proto

pre-push:
  jobs:
    - name: test
      run: task hook:test
