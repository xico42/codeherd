version: '3'

vars:
  BIN_NAME: ch
  INSTALL: '{{.HOME}}/.local/bin/{{.BIN_NAME}}'
  DIST_DIR: dist
  COVERAGE_THRESHOLD: 80
  FMT_TARGETS: '{{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}.{{end}}'
  # Git exports these to hooks (GIT_DIR is absolute in a worktree). Any git
  # call made under them targets this repository, whatever directory it runs
  # in, so the tests' git calls on their temp repos would hit this one.
  # The hook:* tasks clear them before running the real task.
  NO_GIT_HOOK_ENV: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_COMMON_DIR -u GIT_PREFIX

tasks:
  default:
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install pinned tools, download modules and install git hooks
    cmds:
      # tools mise just installed are not on PATH yet in this shell, so
      # reach them through mise exec
      - mise install
      - mise exec -- go mod download
      - mise exec -- lefthook install

  deps:
    desc: Download Go modules
    cmds:
      - go mod download

  build:
    desc: Build ./ch with the version from git describe
    vars:
      GIT_VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev
    cmds:
      - go build -ldflags "-s -w -X main.version={{.GIT_VERSION}}" -o {{.BIN_NAME}} .

  install:
    desc: Build and install ch to ~/.local/bin
    deps: [build]
    cmds:
      - mv {{.BIN_NAME}} {{.INSTALL}}
      - echo "Installed to {{.INSTALL}}"

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  test-integration:
    desc: Run unit and integration tests
    cmds:
      - go test -tags integration ./...

  coverage:
    desc: Run tests with coverage and fail under {{.COVERAGE_THRESHOLD}}%
    cmds:
      - go test -coverprofile=coverage.out ./...
      - |
        # generated code (api/) does not count toward the threshold
        grep -v '^github.com/xico42/codeherd/api/' coverage.out > coverage.tmp
        mv coverage.tmp coverage.out
        COVERAGE=$(go tool cover -func=coverage.out | grep "^total:" | awk '{gsub(/%/,""); print $3}')
        rm -f coverage.out
        echo "Total coverage: ${COVERAGE}%"
        awk -v cov="${COVERAGE}" -v thr="{{.COVERAGE_THRESHOLD}}" \
          'BEGIN { if (cov+0 < thr+0) { print "FAIL: " cov "% < " thr "%"; exit 1 }
                   else { print "OK: " cov "% >= " thr "%" } }'

  lint:
    desc: Check protos, then run golangci-lint
    cmds:
      - task: proto:check
      - golangci-lint run ./...

  proto:generate:
    desc: Generate Go code from proto/ into api/
    cmds:
      - buf generate

  proto:format:
    desc: Format proto files in place
    cmds:
      - buf format -w

  proto:check:
    desc: Check proto format and lint, and that api/ matches the protos (never writes)
    cmds:
      - buf format --diff --exit-code
      - buf lint
      - |
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        buf generate -o "$tmp"
        if ! diff -r "$tmp/api" api; then
          echo "generated code in api/ is stale; run 'task proto:generate'"
          exit 1
        fi

  format:
    desc: Format Go files in place (pass paths after --, default .)
    cmds:
      - gofmt -s -w {{.FMT_TARGETS}}

  format:check:
    desc: List unformatted Go files and fail if any (never writes)
    silent: true
    cmds:
      - |
        files=$(gofmt -s -l {{.FMT_TARGETS}})
        if [ -n "$files" ]; then
          echo "unformatted Go files:"
          echo "$files"
          echo "run 'task format' to fix"
          exit 1
        fi

  check:
    desc: Format check, coverage, integration tests, lint and build
    cmds:
      - task: format:check
      - task: coverage
      - task: test-integration
      - task: lint
      - task: build
      - echo "All checks passed"

  # Git hooks call only these tasks (see lefthook.yml). Each one clears
  # git's hook environment, then runs the real task, so the checks behave
  # as they do from a terminal.
  hook:format:
    desc: 'Git hook: format:check on the given files'
    cmds:
      - '{{.NO_GIT_HOOK_ENV}} task format:check -- {{.CLI_ARGS}}'

  hook:lint:
    desc: 'Git hook: lint'
    cmds:
      - '{{.NO_GIT_HOOK_ENV}} task lint'

  hook:proto:
    desc: 'Git hook: proto:check'
    cmds:
      - '{{.NO_GIT_HOOK_ENV}} task proto:check'

  hook:test:
    desc: 'Git hook: test'
    cmds:
      - '{{.NO_GIT_HOOK_ENV}} task test'

  clean:
    desc: Remove build and coverage outputs
    cmds:
      - rm -rf {{.BIN_NAME}} coverage.out {{.DIST_DIR}}

  release-build:
    desc: Cross-compile a release binary (GOOS=... GOARCH=...)
    requires:
      vars: [GOOS, GOARCH]
    vars:
      VERSION:
        sh: cat VERSION
    env:
      CGO_ENABLED: '0'
      GOOS: '{{.GOOS}}'
      GOARCH: '{{.GOARCH}}'
    cmds:
      - mkdir -p {{.DIST_DIR}}/{{.GOOS}}-{{.GOARCH}}
      - go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o {{.DIST_DIR}}/{{.GOOS}}-{{.GOARCH}}/{{.BIN_NAME}} .

  release-archive:
    desc: Package a release binary with LICENSE and README.md (GOOS=... GOARCH=...)
    requires:
      vars: [GOOS, GOARCH]
    vars:
      VERSION:
        sh: cat VERSION
    cmds:
      - cp LICENSE README.md {{.DIST_DIR}}/{{.GOOS}}-{{.GOARCH}}/
      - tar -C {{.DIST_DIR}}/{{.GOOS}}-{{.GOARCH}} -czf {{.DIST_DIR}}/{{.BIN_NAME}}-{{.VERSION}}-{{.GOOS}}-{{.GOARCH}}.tar.gz {{.BIN_NAME}} LICENSE README.md

  release-checksums:
    desc: Write sha256 checksums for the release archives
    dir: '{{.DIST_DIR}}'
    cmds:
      - sha256sum *.tar.gz > checksums.txt
